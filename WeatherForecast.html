<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Forecast App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #00c6ff, #0072ff);
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    .container {
      margin-top: 100px;
    }

    input {
      padding: 10px;
      width: 250px;
      border: none;
      border-radius: 5px;
      outline: none;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      background-color: #0044cc;
      color: white;
      cursor: pointer;
      margin-left: 10px;
    }

    button:hover {
      background-color: #003399;
    }

    .weather-box {
      margin-top: 30px;
      background: rgba(255, 255, 255, 0.2);
      padding: 20px;
      border-radius: 10px;
      display: inline-block;
      min-width: 300px;
    }

    .error {
      color: #ffcccc;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌤️ Weather Forecast</h1>
    <input type="text" id="city" placeholder="Enter city name">
    <button onclick="getWeather()">Get Weather</button>

    <div id="weatherResult" class="weather-box"></div>
    <div id="error" class="error"></div>
  </div>

  <script>
    async function getWeather() {
      const city = document.getElementById("city").value.trim();
      const weatherBox = document.getElementById("weatherResult");
      const errorBox = document.getElementById("error");

      if (city === "") {
        errorBox.textContent = "Please enter a city name.";
        weatherBox.innerHTML = "";
        return;
      }

      const apiKey = "7c27ca89d2af65ce1461bb713ca942e1"; // 🔹 Replace with your OpenWeatherMap API key
      const apiUrl = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) {
          throw new Error("City not found");
        }

        const data = await response.json();
        const weatherHTML = `
          <h2>${data.name}, ${data.sys.country}</h2>
          <p>🌡️ Temperature: ${data.main.temp} °C</p>
          <p>🌥️ Condition: ${data.weather[0].description}</p>
          <p>💧 Humidity: ${data.main.humidity}%</p>
          <p>🌬️ Wind Speed: ${data.wind.speed} m/s</p>
        `;
        weatherBox.innerHTML = weatherHTML;
        errorBox.textContent = "";
      } catch (error) {
        weatherBox.innerHTML = "";
        errorBox.textContent = "❌ " + error.message;
      }
    }
  </script>
</body>
</html>
